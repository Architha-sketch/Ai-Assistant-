<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }

        header, footer {
            background: #333333;
            color: #fff;
            padding: 1rem;
        }

        .hero {
            padding: 5rem;
            background-color: #f4f4f4;
        }

        button {
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Product</h1>
    </header>

    <section class="hero">
        <h2>Design a Responsive Landing Page</h2>
        <p>This page features a header, hero section, and footer with proper alignment and typography.</p>
        <button>Get Started</button>
    </section>

    <footer>
        <p>&copy; 2024 My Product. All rights reserved.</p>
    </footer>

</body>
</html>
